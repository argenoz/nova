<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Примеры</title>
    <!-- Подключаем Halfmoon CSS -->
    <link
      href="CSS/simple.css"
      rel="stylesheet"
    />
	<link
      href="CSS/css/halfmoon.min.css"
      rel="stylesheet"
    />
	
	
	<style>
        body.halfmoon-theme-dark {
            background-color: #121212;
            color: #e0e0e0;
        }

        .container {
            max-width: 900px;
        }

        /* --- Стили для скролл-контейнера --- */
        .scroll-wrapper {
            border: 3px solid #4CAF50; /* Зеленая рамка */
            border-radius: 12px;
            background-color: #1e1e1e;
            padding: 10px;
            overflow: hidden; /* Скрывает контент, выходящий за границы */
            position: relative;
        }

        .scroll-content {
            display: flex;
            gap: 15px; /* Расстояние между блоками */
            padding-bottom: 10px;
            
            /* Включаем горизонтальную прокрутку */
            overflow-x: auto;
            overflow-y: hidden;
            
            /* Стилизация скроллбара для Webkit-браузеров (Chrome, Safari) */
            scrollbar-width: thin;
            scrollbar-color: #4CAF50 #1e1e1e;
        }

        .scroll-content::-webkit-scrollbar {
            height: 8px;
        }
        .scroll-content::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 10px;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background-color: #4CAF50;
            border-radius: 10px;
        }

        /* --- Стили для маленьких блоков --- */
        .scroll-item {
            flex: 0 0 auto; /* Запрещаем блокам сжиматься и расти */
            width: 150px; /* Фиксированная ширина блока */
            height: 120px;
            
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 8px;
            
            display: flex;
            align-items: center;
            justify-content: center;
            
            font-weight: bold;
            color: white;
            
            /* Чтобы блоки переносились на мобильных экранах */
            min-width: 120px;
        }

        .item-1 { border-color: #ff9800; } /* Оранжевый */
        .item-2 { border-color: #2196f3; } /* Синий */
        .item-3 { border-color: #4caf50; } /* Зеленый */
        .item-4 { border-color: #f44336; } /* Красный */
        .item-5 { border-color: #9c27b0; } /* Фиолетовый */
    </style>
</head>
<body class="halfmoon-theme-dark">

    <div class="container mt-5">
        <h1 class="text-center mb-4">Список примеров</h1>
        
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <!-- Блок с рамкой и скроллом -->
                <div class="scroll-wrapper">
                    <div class="scroll-content">
                        <div class="scroll-item item-1">
						<a href="https://ishosting.com/">
						ishosting
						</a>
						</div>
                        <div class="scroll-item item-1">
						<a href="https://4vps.su/">
						4vps
						</a>
						</div>
						<div class="scroll-item item-1">
						<a href="https://adminvps.ru/">
						adminvps
						</a>
						</div>
						<div class="scroll-item item-1">
						<a href="https://fastfox.pro/">
						fastfox
						</a>
						</div>
						<div class="scroll-item item-1">
						<a href="https://www.reg.ru/">
						Рег.ру
						</a>
						</div>
                    </div>
                </div>

                <p class="text-center text-muted mt-3">
                    <a href="/">
					Перейти назад
					</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
